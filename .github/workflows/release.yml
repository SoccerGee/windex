name: Release

# Push a version tag to cut a release:
#   ./scripts/release.sh 0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    # macOS 14 runners are Apple Silicon; the build script cross-compiles the
    # Intel slice and lipos them together.
    runs-on: macos-14
    env:
      # `secrets` is not available in step-level `if`, so surface it as env.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check tag matches Cargo.toml version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build disk image
        run: ./scripts/build-dmg.sh

      - name: Publish release
        # Pinned to a commit: a version tag can be moved to different code.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Windex ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/Windex-${{ env.VERSION }}.dmg
            dist/Windex-${{ env.VERSION }}.dmg.sha256

      - name: Update Homebrew tap
        # Optional: set the HOMEBREW_TAP_TOKEN secret to a PAT with contents
        # write access to SoccerGee/homebrew-tap and the cask updates itself.
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sha="$(shasum -a 256 "dist/Windex-$VERSION.dmg" | awk '{print $1}')"

          # The token is passed per-command as a header rather than embedded in
          # the remote URL, so it never lands in .git/config or in error output.
          # openssl (not base64) because it will not line-wrap long tokens.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | openssl base64 -A)"
          git_auth() { git -c "http.https://github.com/.extraheader=Authorization: Basic $auth" "$@"; }

          git_auth clone --depth 1 https://github.com/SoccerGee/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$sha/g" \
            packaging/homebrew/windex.rb.in > tap/Casks/windex.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/windex.rb
          git commit -m "windex $VERSION" || exit 0
          git_auth push
