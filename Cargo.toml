[package]
name = "windex"
version = "0.1.2"
edition = "2021"
description = "A macOS window manager with grid-based snapping and smooth animations"
authors = ["Grant Tuttle"]
license = "MIT"

[dependencies]
# macOS Accessibility API for window manipulation
accessibility-sys = "0.1"

# Channel for events
crossbeam-channel = "0.5"

# Display/monitor enumeration
core-graphics = "0.24"
core-foundation = "0.10"

# Global hotkey registration
global-hotkey = "0.6"

# Alternative keyboard listener
rdev = "0.5"

# Menu bar tray icon
tray-icon = "0.19"

# Objective-C bindings for NSApplication
objc2 = "0.5"
# NSScreen + NSGraphics power the per-display visibleFrame lookup
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSResponder", "NSScreen", "NSGraphics"] }
# NSThread carries MainThreadMarker::new. It currently arrives via tray-icon's
# own dependency, but relying on another crate's feature selection is fragile.
# NSValue carries NSNumber (to read NSScreenNumber); NSEnumerator carries
# NSArray::iter (to walk NSScreen.screens).
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSDictionary", "NSDate", "NSRunLoop", "NSThread", "NSValue", "NSEnumerator"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

# Animation easing
keyframe = "1.1"

# Accessibility permission checking
macos-accessibility-client = "0.0.1"

# getuid() for the per-user launchctl domain
libc = "0.2"

# Error handling
anyhow = "1.0.103"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
pretty_assertions = "1.4"

# Debugging aids for the keyboard layer, kept out of the default build:
#   cargo run --example probe_rdev
[profile.release]
opt-level = 3
lto = true
